<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMF SYSTEM</title>

<!-- PARTICLES -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial;
    color: var(--text);
}

/* FUNDO PARTICULAS */
#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    background: var(--bg);
    z-index: -1;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    text-align: center;
}

nav a {
    color: #fff;
    margin: 0 15px;
    text-decoration: none;
}

/* HEADER */
header {
    text-align: center;
    margin-top: 80px;
    animation: fadeIn 1.5s ease;
}

/* MAIN */
main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* BOTÃO */
.btn {
    display: inline-block;
    background: var(--primary);
    padding: 10px 20px;
    color: #000;
    border-radius: 5px;
    text-decoration: none;
}

/* LOCALIZAÇÃO */
#location-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #007bff;
    padding: 10px;
    text-align: center;
}

/* ANIMAÇÃO */
@keyframes fadeIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
}
</style>
</head>

<body>

<!-- FUNDO -->
<div id="particles-js"></div>

<nav>
    <a href="#">Sobre</a>
    <a href="#">Projetos</a>
    <a href="#">Contato</a>
</nav>

<header>
    <h1>DMF SYSTEM</h1>
    <p>Portfólio profissional</p>
</header>

<main>

<div class="card">
    <h2>Sobre</h2>
    <p>Analista de sistemas apaixonado por tecnologia.</p>
</div>

<div class="card">
    <h2>Projeto</h2>
    <a href="#" class="btn">Ver projeto</a>
</div>

</main>

<div id="location-box">🔄 Detectando localização...</div>

<script>
// 🌍 LOCALIZAÇÃO + CLIMA + BANDEIRA
async function getLocation() {
    const box = document.getElementById("location-box");

    try {
        const res = await fetch("https://ipwho.is/");
        const data = await res.json();

        if (!data.success) throw new Error();

        const city = data.city;
        const country = data.country;
        const code = data.country_code.toLowerCase();

        const flag = `https://flagcdn.com/w40/${code}.png`;

        const weatherRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${data.latitude}&longitude=${data.longitude}&current_weather=true`
        );

        const weatherData = await weatherRes.json();
        const temp = weatherData.current_weather.temperature;

        box.innerHTML = `
            <img src="${flag}" width="20">
            ${city}, ${country} | 🌡️ ${temp}°C
        `;

    } catch {
        box.innerHTML = "❌ Não foi possível obter localização";
    }
}

getLocation();

// 🎆 PARTICLES CONFIG
particlesJS("particles-js", {
  particles: {
    number: { value: 100 },
    color: { value: "#00ffcc" },
    size: { value: 3 },
    move: { speed: 1.5 },
    line_linked: {
      enable: true,
      distance: 140,
      color: "#00ffcc",
      opacity: 0.4
    }
  }
});
</script>

</body>
</html>
