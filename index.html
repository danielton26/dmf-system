<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMF SYSTEM</title>
    <link rel="icon" type="image/png" href="images/icone.png">

    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #00FF00;
            --bg-light: #fff;
            --bg-dark: #000;
            --text-light: #fff;
            --text-dark: #000;
            --card-bg: rgba(255,255,255,0.1);
            --card-border: rgba(255,255,255,0.3);
        }

        * { box-sizing: border-box; margin:0; padding:0; }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        body.light-mode { background-color: var(--bg-light); color: var(--text-dark); }
        body.dark-mode { background-color: var(--bg-dark); color: var(--text-light); }

        .background {
            position: fixed;
            width: 100%; height: 100%;
            background: url('images/dmf-system.jpg') center/cover no-repeat;
            opacity: 0.1;
            z-index: -1;
        }

        header { text-align: center; margin-top: 60px; }
        header img { max-width: 300px; }

        nav {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
        }

        main {
            padding: 20px;
            background: rgba(0,0,0,0.7);
            max-width: 1200px;
            margin: auto;
            border-radius: 10px;
            color: #fff;
        }

        section { margin-bottom: 40px; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap: 20px;
        }

        .project {
            padding: 15px;
            border-radius: 5px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
        }

        .details-button {
            background: var(--primary-color);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.9);
            color: #fff;
        }

        #user-location {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,123,255,0.7);
            color: #fff;
            padding: 10px;
            text-align: center;
        }

        .toggle-container {
            position: fixed;
            bottom: 50px;
            left: 10px;
        }
    </style>
</head>

<body class="dark-mode">

<div class="background"></div>

<nav>
    <a href="#sobre">Sobre</a>
    <a href="#projetos">Projetos</a>
    <a href="#contato">Contato</a>
</nav>

<div id="user-location">Carregando localização...</div>

<header>
    <h1>DMF SYSTEM</h1>
    <img src="images/dmf-system.jpg">
</header>

<main>

<section id="sobre">
    <h2>Sobre</h2>
    <p>Sou analista de sistemas apaixonado por tecnologia.</p>
</section>

<section id="projetos">
    <h2>Projetos</h2>
    <div class="projects-grid">
        <div class="project">
            <h3>Izing</h3>
            <a href="#" class="details-button">Ver mais</a>
        </div>
    </div>
</section>

<section id="contato">
    <h2>Contato</h2>
    <a href="https://wa.me/5544984531288" class="details-button">WhatsApp</a>
</section>

</main>

<footer>
    <div id="datetime"></div>
    <p>© 2024 DMF SYSTEM</p>
</footer>

<div class="toggle-container">
    <input type="checkbox" id="mode-toggle">
    <label for="mode-toggle">Modo</label>
</div>

<script>
// Tema
const toggle = document.getElementById('mode-toggle');
const body = document.body;

toggle.addEventListener('change', () => {
    body.classList.toggle('light-mode');
    body.classList.toggle('dark-mode');
});

// Data
function updateDateTime(){
    const now = new Date();
    document.getElementById("datetime").textContent =
        now.toLocaleString('pt-BR');
}
setInterval(updateDateTime,1000);

// LOCALIZAÇÃO CORRIGIDA ✅
function getUserLocation() {
    fetch('https://ipwho.is/')
        .then(res => res.json())
        .then(data => {
            document.getElementById("user-location").textContent =
                `Você está em: ${data.city}, ${data.region}, ${data.country}`;
        })
        .catch(() => {
            document.getElementById("user-location").textContent =
                "Não foi possível obter a localização.";
        });
}

getUserLocation();
</script>

</body>
</html>
